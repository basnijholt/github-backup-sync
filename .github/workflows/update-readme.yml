name: Update README.md

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Update README.md with markdown-code-runner
        env:
          TERM: dumb
          NO_COLOR: 1
          TERMINAL_WIDTH: 90
        run: |
          uvx markdown-code-runner --verbose README.md
          sed -i 's/[[:space:]]*$//' README.md

      - name: Commit updated README.md
        id: commit
        run: |
          git add README.md
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in README.md, skipping commit."
            echo "commit_status=skipped" >> $GITHUB_ENV
          else
            git commit -m "docs: auto-update README.md with markdown-code-runner"
            echo "commit_status=committed" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: env.commit_status == 'committed' && github.event_name == 'push'
        run: git push origin HEAD:${{ github.ref }}
